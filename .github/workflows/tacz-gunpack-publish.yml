name: Publish TaCZ Gunpack Lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/minecraft-gun-mods/tacz/publication.txt']
permissions:
  contents: write
concurrency:
  group: tacz-gunpack-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read approved source and exact browser acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/tacz-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%%s\\n" "$GH_TOKEN" ;; esac\n' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git clone --depth 1 --filter=blob:none --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git sparse-checkout init --no-cone
          printf '/docs/minecraft-gun-mods/\n/docs/TaCZ-Gunpack*.md\n' > .git/info/sparse-checkout
          git checkout main
          git rev-parse HEAD > docs/minecraft-gun-mods/tacz/qa/published-source-commit.txt
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('docs/minecraft-gun-mods/tacz');data=json.loads((p/'catalog.json').read_text());qa=json.loads((p/'qa/browser-report.json').read_text())
          assert qa['passed'] and all(x['passed'] for x in qa['checks'])
          assert qa['dataHash']==data['build']['dataHash'] and qa['expected']==len(data['items'])
          assert hashlib.sha256((p.parent/'catalog.json').read_bytes()).hexdigest()=='f137707883003cb6bce10b8e03fec00900ae9a1138577f5141520fc2c66ee994'
          print('Approved',len(data['items']),'gunpack families;',len(qa['checks']),'browser checks')
          PY
      - name: Verify complete portable snapshot without network access
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4 pillow playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python3 -m playwright install --with-deps chromium; fi
          python3 source/docs/minecraft-gun-mods/tacz/publish_tacz.py package release
          python3 source/docs/minecraft-gun-mods/tacz/publish_tacz.py offline release
          cp release/OFFLINE-VERIFICATION.json source/docs/minecraft-gun-mods/tacz/qa/offline-verification.json
      - name: Publish the actual TaCZ Wiki under Weapon Inspirations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_ASKPASS="$RUNNER_TEMP/tacz-askpass.sh" GIT_TERMINAL_PROMPT=0
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          python3 source/docs/minecraft-gun-mods/tacz/publish_tacz.py prepare wiki
          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if ! git diff --cached --quiet; then git commit -m 'Publish dedicated source-ranked TaCZ gunpack collection'; git push origin HEAD; fi
          git rev-parse HEAD > ../source/docs/minecraft-gun-mods/tacz/qa/published-wiki-commit.txt
      - name: Verify the actual live Wiki and deployed Pages data
        run: |
          python3 source/docs/minecraft-gun-mods/tacz/publish_tacz.py verify
          python3 source/docs/minecraft-gun-mods/tacz/test_tacz.py --url https://herbertofury.github.io/Advent-of-Ascension/minecraft-gun-mods/tacz/ --output source/docs/minecraft-gun-mods/tacz/qa/live-browser
      - name: Package verified source, every referenced image and publication receipts
        run: python3 source/docs/minecraft-gun-mods/tacz/publish_tacz.py package release
      - name: Publish and read back the permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=tacz-gunpack-lab-v1.0.0
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release preserved. Check its digest before any replacement.'
          else
            gh release create "$TAG" release/TaCZ-Gunpack-Lab.zip release/RELEASE-VERIFICATION.json release/OFFLINE-VERIFICATION.json release/SHA256SUMS.txt release/START-HERE.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TaCZ Gunpack Lab' --notes-file release/START-HERE.md
          fi
          mkdir -p readback
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern TaCZ-Gunpack-Lab.zip --dir readback
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('release/RELEASE-VERIFICATION.json').read_text());p=Path('readback/TaCZ-Gunpack-Lab.zip');actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual==expected['sha256'] and p.stat().st_size==expected['bytes']
          Path('release/GITHUB-READBACK.json').write_text(json.dumps({'sha256':actual,'bytes':p.stat().st_size,'verified':True},indent=2))
          PY
      - name: Preserve complete release and live proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tacz-gunpack-published
          path: |
            release/*.zip
            release/*.json
            release/*.txt
            release/*.md
            source/docs/minecraft-gun-mods/tacz/qa/
          retention-days: 30
          if-no-files-found: error
