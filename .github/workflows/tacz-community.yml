name: TaCZ community discoveries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tacz-community.yml'
      - 'docs/minecraft-gun-mods/tacz-community/stage.txt'
permissions:
  contents: write
  actions: read
concurrency:
  group: tacz-community-discoveries
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Continue canonical catalog on a review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/tacz-community-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%%s\\n" "$GH_TOKEN" ;; esac\n' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git clone --depth 100 --filter=blob:none --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git sparse-checkout init --no-cone
          printf '/docs/minecraft-gun-mods/\n/docs/TaCZ-Gunpack*.md\n/docs/Minecraft-Gun-Mod-Inspirations*.md\n/docs/Minecraft-Gunpack-Creator-Discoveries.md\n/docs/Weapon-Inspirations.md\n/docs/Weapon-Reference-Library.md\n/AGENTS.md\n' > .git/info/sparse-checkout
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin tacz-community-discovery >/dev/null 2>&1; then
            git fetch --depth 100 origin refs/heads/tacz-community-discovery:refs/remotes/origin/tacz-community-discovery refs/heads/main:refs/remotes/origin/main
            git checkout -B tacz-community-discovery origin/tacz-community-discovery
            git merge origin/main --no-edit
          else
            git checkout -b tacz-community-discovery origin/main
          fi
      - name: Execute the current gap-directed stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4 pillow playwright
          cd source
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/minecraft-gun-mods/tacz-community/research_community.py')
          s=p.read_text();s=s.replace("record.get('owner',{}).get('mid')", "(record.get('owner') or {}).get('mid')")
          p.write_text(s)
          PY
          if [ -f docs/minecraft-gun-mods/tacz-community/build_community.py ]; then
            python3 docs/minecraft-gun-mods/tacz-community/build_community.py
          elif [ -f docs/minecraft-gun-mods/tacz-community/resume.py ]; then
            python3 docs/minecraft-gun-mods/tacz-community/resume.py
          else
            python3 docs/minecraft-gun-mods/tacz-community/research_community.py
          fi
      - name: Persist concise evidence before additional validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_ASKPASS="$RUNNER_TEMP/tacz-community-askpass.sh" GIT_TERMINAL_PROMPT=0
          cd source
          git add docs/minecraft-gun-mods/tacz-community/research_community.py
          for file in coverage.json baseline-identity.json qualified-records.json selection.json source-decisions.json data-verification.json; do
            if [ -f "docs/minecraft-gun-mods/tacz-community/$file" ]; then git add "docs/minecraft-gun-mods/tacz-community/$file"; fi
          done
          if [ -d docs/minecraft-gun-mods/tacz-community/assets ]; then git add docs/minecraft-gun-mods/tacz-community/assets; fi
          if ! git diff --cached --quiet; then git commit -m 'Checkpoint new TaCZ community-source evidence without changing existing records'; fi
          git push origin HEAD:tacz-community-discovery
      - name: Preserve exact source evidence for qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tacz-community-discovery
          path: |
            source/docs/minecraft-gun-mods/tacz-community/
            !source/docs/minecraft-gun-mods/tacz-community/cache/**
            !source/docs/minecraft-gun-mods/tacz-community/__pycache__/**
          retention-days: 30
          if-no-files-found: error
