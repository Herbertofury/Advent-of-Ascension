name: Build illustrated weapon Wiki galleries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-weapon-galleries.yml'
      - 'docs/weapon-inspirations/*.py'
      - 'docs/weapon-inspirations/*.py.txt'
      - 'docs/weapon-inspirations/*-overrides.json'
      - 'docs/weapon-inspirations/gaming-additions.tsv'
permissions:
  contents: write
concurrency:
  group: illustrated-weapon-galleries
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Open exact scoped source worktree
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASKPASS="$RUNNER_TEMP/weapon-gallery-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) printf "%%s\\n" "$WIKI_TOKEN" ;; esac\n' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          export GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0
          git clone --depth 1 --filter=blob:none --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" source
          cd source
          git sparse-checkout init --no-cone
          printf '/docs/weapon-inspirations/\n/docs/Historical-and-Experimental-Gun-Inspirations.md\n/docs/Video-Game-Weapon-Inspirations.md\n' > .git/info/sparse-checkout
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout -B media-publish "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Repair missing media without rediscovering completed records
        run: |
          set -euo pipefail
          cd source
          python3 -m pip install --quiet requests beautifulsoup4 pillow
          python3 -m py_compile docs/weapon-inspirations/build_galleries.py docs/weapon-inspirations/finish_media.py.txt
          python3 docs/weapon-inspirations/finish_media.py.txt
      - name: Persist coherent source and image checkpoint
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_ASKPASS="$RUNNER_TEMP/weapon-gallery-askpass.sh" GIT_TERMINAL_PROMPT=0
          cd source
          git add docs/weapon-inspirations/*.json docs/weapon-inspirations/images docs/Historical-and-Experimental-Gun-Inspirations.md docs/Video-Game-Weapon-Inspirations.md
          if ! git diff --cached --quiet; then
            git commit -m 'Repair illustrated gallery media and preserve all 1044 references'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
      - name: Publish both galleries to the actual Wiki Git repository
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_ASKPASS="$RUNNER_TEMP/weapon-gallery-askpass.sh" GIT_TERMINAL_PROMPT=0
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          python3 source/docs/weapon-inspirations/build_galleries.py --publish-only wiki
          cd wiki
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'Publish illustrated gaming and historical inspiration galleries'
            git push origin HEAD
          fi
          git rev-parse HEAD > ../source/docs/weapon-inspirations/qa/wiki-commit.txt
      - name: Verify actual rendered Wiki contains every entry and image
        run: python3 source/docs/weapon-inspirations/finish_media.py.txt --verify-live wiki
      - name: Persist live Wiki publication receipt
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GIT_ASKPASS="$RUNNER_TEMP/weapon-gallery-askpass.sh" GIT_TERMINAL_PROMPT=0
          cd source
          git add docs/weapon-inspirations/qa/live-wiki-verification.json docs/weapon-inspirations/qa/wiki-commit.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record live Wiki rendered-image and full-entry verification'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve complete catalog, media and visual verification bundle
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: aoa-weapon-inspiration-galleries
          path: |
            source/docs/weapon-inspirations/
            source/docs/Historical-and-Experimental-Gun-Inspirations.md
            source/docs/Video-Game-Weapon-Inspirations.md
            !source/docs/weapon-inspirations/__pycache__/**
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
